name: SEO Keyword Update

on:
  schedule:
    - cron: '0 8 1,15 * *'  # ה-1 וה-15 בחודש, 8:00 UTC (11:00 שעון ישראל)
  workflow_dispatch:          # הפעלה ידנית מ-GitHub
    inputs:
      dry_run:
        description: 'Dry run — הצג שינויים בלי לשמור קבצים'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # אין token מפורש — משתמש ב-github.token שתמיד קיים ויש לו contents:write
        # אין submodules — scanner-site מנוהל כקבצים רגילים (אין .gitmodules)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run SEO updater
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          node seo-updater.mjs $ARGS

      - name: Sync scanner.html → scanner-site/index.html
        if: github.event.inputs.dry_run != 'true'
        run: node update-scanner-site.mjs

      - name: Push scanner-site → automation-scanner repo
        if: github.event.inputs.dry_run != 'true'
        env:
          TOKEN: ${{ secrets.SCANNER_DEPLOY_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "⚠️  SCANNER_DEPLOY_TOKEN לא מוגדר — מדלג על push לscanner-site"
            exit 0
          fi
          git config user.name "SEO Bot"
          git config user.email "bot@clix-automations.com"
          git clone --depth 1 https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/automation-scanner.git /tmp/automation-scanner
          cp -r scanner-site/. /tmp/automation-scanner/
          cd /tmp/automation-scanner
          git add -A
          git diff --staged --quiet && echo "No changes in scanner-site" || (
            git commit -m "seo: עדכון מילות מפתח $(date +'%Y-%m-%d')" &&
            git push
          )

      - name: Commit & push main repo
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "SEO Bot"
          git config user.email "bot@clix-automations.com"
          git add index.html blog.html scanner.html scanner-site/ posts/ sitemap.xml
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "seo: עדכון מילות מפתח $(date +'%Y-%m-%d')" &&
            git push
          )
