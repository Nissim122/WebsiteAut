name: SEO Keyword Update

on:
  schedule:
    - cron: '0 8 1,15 * *'  # ה-1 וה-15 בחודש, 8:00 UTC (11:00 שעון ישראל)
  workflow_dispatch:          # הפעלה ידנית מ-GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-seo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SCANNER_DEPLOY_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run SEO updater
        run: node seo-updater.mjs

      - name: Sync scanner.html → scanner-site/index.html
        run: node update-scanner-site.mjs

      - name: Commit & push scanner-site (submodule)
        run: |
          git config user.name "SEO Bot"
          git config user.email "bot@clix-automations.com"
          cd scanner-site
          git remote set-url origin https://x-access-token:${{ secrets.SCANNER_DEPLOY_TOKEN }}@github.com/${{ github.repository_owner }}/automation-scanner.git
          git add -A
          git diff --staged --quiet && echo "No changes in scanner-site" || (
            git commit -m "seo: עדכון מילות מפתח $(date +'%Y-%m-%d')" &&
            git push origin HEAD
          )
          cd ..

      - name: Commit & push main repo
        run: |
          git config user.name "SEO Bot"
          git config user.email "bot@clix-automations.com"
          git add index.html blog.html scanner.html scanner-site posts/ sitemap.xml
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "seo: עדכון מילות מפתח $(date +'%Y-%m-%d')" &&
            git push
          )
