<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Heebo', 'Arial', sans-serif;
    background: #0e1628;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Background gradients */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 70% at 15% 50%, rgba(33,150,176,0.22) 0%, transparent 65%),
      radial-gradient(ellipse 50% 60% at 85% 20%, rgba(224,23,107,0.14) 0%, transparent 65%),
      radial-gradient(ellipse 40% 40% at 70% 85%, rgba(33,150,176,0.10) 0%, transparent 65%),
      #0e1628;
  }

  /* Grain texture */
  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  /* Border glow */
  .border-glow {
    position: absolute;
    inset: 0;
    border: 2px solid rgba(33,150,176,0.25);
    border-radius: 4px;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 80px;
    gap: 0;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(33,150,176,0.15);
    border: 1px solid rgba(33,150,176,0.4);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 16px;
    font-weight: 600;
    color: #2db3cd;
    margin-bottom: 28px;
    letter-spacing: 0.02em;
  }

  .badge-dot {
    width: 7px;
    height: 7px;
    background: #2db3cd;
    border-radius: 50%;
    box-shadow: 0 0 8px #2db3cd;
  }

  /* Main heading */
  h1 {
    font-size: 72px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.75) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  h1 span {
    background: linear-gradient(135deg, #2196b0, #2db3cd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Subtitle */
  .subtitle {
    font-size: 24px;
    font-weight: 400;
    color: rgba(255,255,255,0.6);
    line-height: 1.5;
    max-width: 800px;
    margin-bottom: 44px;
  }

  /* Steps row */
  .steps {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
  }

  .step-num {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #2196b0, #2db3cd);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .arrow {
    color: rgba(255,255,255,0.2);
    font-size: 20px;
  }

  /* Brand watermark */
  .brand {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.08em;
    z-index: 2;
  }

  /* Left accent line */
  .accent-line {
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, transparent, #2196b0 30%, #e0176b 70%, transparent);
    opacity: 0.6;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg"></div>
  <div class="grain"></div>
  <div class="border-glow"></div>
  <div class="accent-line"></div>

  <div class="content">
    <div class="badge">
      <div class="badge-dot"></div>
      חינמי · ללא התחייבות
    </div>

    <h1>סורק <span>אוטומציות</span></h1>

    <p class="subtitle">ענה על 3 שאלות קצרות וגלה איפה העסק שלך מבזבז זמן — וכמה אפשר לחסוך כבר השבוע</p>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        בחר כלים
      </div>
      <div class="arrow">←</div>
      <div class="step">
        <div class="step-num">2</div>
        זהה אתגרים
      </div>
      <div class="arrow">←</div>
      <div class="step">
        <div class="step-num">3</div>
        קבל מפת אוטומציה
      </div>
    </div>
  </div>

  <div class="brand">clix-automations.com</div>
</body>
</html>
